<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sentinel AI</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1>Sentinel AI</h1>
            <p>Optimización de rutas de patrullaje</p>

            <label>Hora del patrullaje</label>
            <input type="time" id="hour" value="18:30">

            <button id="calculateBtn">Calcular ruta</button>
            <button id="resetBtn">Reiniciar puntos</button>

            <div class="results">
                <h2>Resultados</h2>
                <p><strong>Distancia:</strong> <span id="distance">-</span> km</p>
                <p><strong>Tiempo:</strong> <span id="time">-</span> min</p>
                <p><strong>Combustible:</strong> <span id="fuel">-</span> L</p>
                <p><strong>Tráfico:</strong> <span id="traffic">-</span></p>
                <p><strong>Patrulla:</strong> <span id="patrol">-</span></p>
            </div>

            <small>Haz clic en el mapa para elegir punto A y punto B.</small>
        </aside>

        <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
